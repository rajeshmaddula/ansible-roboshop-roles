- name: app set up
  ansible.builtin.import_role:
    name: commom
    tasks_from: app-setup.yaml

- name: java set up
  ansible.builtin.import_role:
    name: commom
    tasks_from: app-setup.yaml

- name: systemd setup
  ansible.builtin.import_role:
    name: common
    tasks_from: systemd-setup.yaml

- name: Install Python pip
  ansible.builtin.dnf:
    name: python3-pip
    state: present

- name: Install PyMySQL
  ansible.builtin.pip:
    name: PyMySQL
    executable: pip3

- name: Import shipping data
  community.mysql.mysql_db:
    name: all
    state: import
    target: "{{ item }}"
    login_host: "{{ MYSQL_HOST }}"
    login_user: root
    login_password: RoboShop@1
  loop:
      - /app/db/schema.sql
      - /app/db/app-user.sql
      - /app/db/master-data.sql

- name: start shipping
  ansible.builtin.service:
    name: shipping
    state: restarted
    enabled: yes